<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>User Registration</h2>
    <div>
        <span id="adminInfo" class="me-3"></span>
        <button onclick="logout()" class="btn btn-sm btn-outline-danger">Logout</button>
    </div>
</div>

<form id="registerForm" class="mx-auto" style="max-width: 400px;">
    <div class="mb-3">
        <label>Name:</label>
        <input type="text" class="form-control" id="name" required minlength="2" maxlength="100">
    </div>
    <div class="mb-3">
        <label>Email:</label>
        <input type="email" class="form-control" id="email" required>
    </div>
    <div class="mb-3">
        <label>Password:</label>
        <input type="password" class="form-control" id="password" required minlength="6">
    </div>
    <div class="mb-3">
        <label>Role:</label>
        <select class="form-control" id="role" required>
            <option value="USER">User</option>
            <option value="ADMIN">Admin</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary w-100">Register</button>
    <p class="mt-3 text-center">
        Already have an account? <a href="/login">Login</a>
    </p>
</form>

<script>
    const email = localStorage.getItem('email');
    const role = localStorage.getItem('role');
    if (email && role) {
        document.getElementById('adminInfo').innerHTML = 
            `<span class="badge bg-primary">Logged in as: ${email} (${role})</span>`;
    } else {
        alert('You must be logged in as admin to access this page');
        window.location.href = '/login';
    }
    
    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('email');
        localStorage.removeItem('role');
        window.location.href = '/login';
    }
    
    document.getElementById("registerForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const data = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            role: document.getElementById("role").value
        };
        
        const token = localStorage.getItem('token');
        
        try {
            const response = await fetch("/api/users", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify(data)
            });
            
            if (response.ok) {
                const result = await response.json();
                alert("Registration successful! User created: " + data.email);
                document.getElementById("registerForm").reset();
            } else {
                const err = await response.json();
                alert("Error: " + (err.message || "Registration failed"));
            }
        } catch (error) {
            alert("Error: " + error.message);
        }
    });
</script>
</body>
</html>
