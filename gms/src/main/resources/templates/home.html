<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>GMS - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="text-center">
    <h1 class="mb-4">Welcome to Gym Management System</h1>
    <p class="lead">You are logged in successfully!</p>
    <div class="mt-4">
        <a href="/login" class="btn btn-primary">Go to Login</a>
        <button onclick="logout()" class="btn btn-danger">Logout</button>
    </div>
    <div class="mt-3" id="userInfo"></div>
</div>

<script>
    const email = localStorage.getItem('email');
    const role = localStorage.getItem('role');
    if (email && role) {
        document.getElementById('userInfo').innerHTML = 
            `<p class="text-muted">Logged in as: <strong>${email}</strong> (${role})</p>`;
    }
    
    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('email');
        localStorage.removeItem('role');
        window.location.href = '/login';
    }
</script>
</body>
</html>
