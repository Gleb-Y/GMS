spring.application.name=GMS
spring.datasource.url=jdbc:postgresql://localhost:5432/gms_db
spring.datasource.username=postgres
spring.datasource.password=postgres
server.port=8080

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true

# Force Flyway logging
logging.level.org.flywaydb=INFO

# JPA/Hibernate configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log SQL queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Enable request/response logging
spring.mvc.log-request-details=true
logging.config=classpath:logback-spring.xml

# Logging
logging.level.root=INFO
logging.level.com.gyurt.gms=DEBUG
logging.level.org.zalando.logbook=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Logbook configuration
logbook.format.curl=default
logbook.format.curl.request-uri=full
logbook.obfuscate.headers=authorization,proxy-authorization
logbook.obfuscate.parameters=password,secret,token
logbook.write.level=INFO