spring.application.name=GMS
spring.datasource.url=jdbc:postgresql://localhost:5432/gms_db
spring.datasource.username=postgres
spring.datasource.password=postgres
server.port=8080

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
#spring.flyway.validate-on-migrate=false

# Force Flyway logging
logging.level.org.flywaydb=INFO

# JPA/Hibernate configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log SQL queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Enable request/response logging
spring.mvc.log-request-details=true
logging.config=classpath:logback-spring.xml

# Logging
logging.level.root=INFO
logging.level.com.gyurt.gms=DEBUG
logging.level.org.zalando.logbook=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Logbook configuration
logbook.format.curl=default
logbook.format.curl.request-uri=full
logbook.obfuscate.headers=authorization,proxy-authorization
logbook.obfuscate.parameters=password,secret,token
logbook.write.level=INFO

# Redis configuration
spring.cache.type=redis
spring.redis.host=redis
spring.redis.port=6379
spring.redis.timeout=60000
spring.redis.password=shish-secure-password
spring.redis.jedis.pool.max-active=8
spring.redis.jedis.pool.max-idle=8
spring.redis.jedis.pool.min-idle=0

# Cache Configuration
spring.cache.redis.time-to-live=3600000  # 1 hour
spring.cache.redis.key-prefix=gms:cache:
spring.cache.redis.cache-null-values=false

# RabbitMQ configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Async configuration
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.scheduling.pool.size=2